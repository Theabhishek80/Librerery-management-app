# ============================
# Server
# ============================
server.port=${PORT:8080}

# ============================
# MySQL Database
# All values can be overridden by environment variables, which is how
# every hosting platform (Render, Railway, Aiven, a VPS, etc.) should
# configure this app - never hardcode real credentials here.
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# JWT Config
# IMPORTANT: set APP_JWT_SECRET as a real secret on your hosting platform.
# The fallback below is only for local development.
# ============================
app.jwt.secret=${APP_JWT_SECRET:ChangeThisToALongRandomSecretKeyForProductionUseAtLeast64BytesLongForHS512Safety123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ============================
# CORS
# Set this to your deployed frontend URL(s), comma-separated, e.g.
# APP_CORS_ALLOWED_ORIGINS=https://my-library.vercel.app
# ============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================
# Default admin seeded on first startup (see DataSeeder)
# Override these on any public deployment!
# ============================
app.admin.username=${APP_ADMIN_USERNAME:abhishek80}
app.admin.email=${APP_ADMIN_EMAIL:admin@library.com}
app.admin.password=${APP_ADMIN_PASSWORD:Abhishek@123}
